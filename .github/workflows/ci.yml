name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API – lint, tests unitaires et d'intégration, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brocantes_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package.json
      # Passer à "npm ci" une fois package-lock.json committé.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - name: Tests unitaires (couverture ≥ 80 %)
        run: npm run test:cov
      - name: Tests d'intégration (PostgreSQL 16)
        run: npm run test:int
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/brocantes_test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: couverture-api
          path: api/coverage
          if-no-files-found: ignore

  web:
    name: Front – lint, tests unitaires, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:cov -- --ci
      - run: npm run build

  deploy:
    name: Déploiement Render (test)
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test
    env:
      HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
      HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Vérifier la configuration Render
        id: config
        run: |
          if [ -z "$HOOK_API" ] || [ -z "$HOOK_WEB" ]; then
            echo "::notice::Déploiement ignoré : ajoutez les secrets RENDER_DEPLOY_HOOK_API et RENDER_DEPLOY_HOOK_WEB (voir README, étape 8)."
            echo "pret=false" >> "$GITHUB_OUTPUT"
          else
            echo "pret=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Déployer l'API
        if: steps.config.outputs.pret == 'true'
        run: curl -fsS -X POST "$HOOK_API"
      - name: Déployer le front
        if: steps.config.outputs.pret == 'true'
        run: curl -fsS -X POST "$HOOK_WEB"
      - name: Attendre que l'API réponde
        if: steps.config.outputs.pret == 'true' && env.API_URL != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$API_URL/health"; then exit 0; fi
            sleep 10
          done
          echo "L'API ne répond pas après 5 minutes" && exit 1
